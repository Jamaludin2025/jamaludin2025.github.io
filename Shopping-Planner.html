<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Planner Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --primary: #0f172a;
      --accent: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --card: #ffffff;
      --text-main: #334155;
      --text-muted: #94a3b8;
      --border: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-top: 80px;
      padding-bottom: 100px;
    }

    #customAlert {
      position: fixed;
      top: -100px; left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 12px 17px;
      border-radius: 15px;
      z-index: 3000;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      width: fit-content;
      max-width: 90%;
      white-space: nowrap;
    }

    .header-fixed-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 0 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      height: 48px;
      position: relative;
    }

    .search-wrapper input {
      border: none; background: transparent; margin-left: 10px;
      width: 100%; outline: none; font-size: 14px;
    }

    #resetSearch { position: absolute; right: 15px; color: var(--text-muted); cursor: pointer; display: none; }

    .btn-add-main {
      background: var(--primary); color: white; border: none;
      width: 48px; height: 48px; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .footer-total {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--primary);
      color: white;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .footer-left-group { display: flex; align-items: center; gap: 15px; }
    .select-all-wrapper { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .select-all-wrapper span { font-size: 9px; margin-top: 4px; opacity: 0.8; font-weight: 700; }
    .footer-total .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .footer-total .amount { font-size: 20px; font-weight: 800; }

    .btn-footer-action {
      width: 38px; height: 38px; border-radius: 10px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.15); color: white;
    }
    .btn-footer-action:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .item-card {
      background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--border);
    }
    .item-left { display: flex; align-items: center; gap: 16px; }
    .checkbox-custom { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent); }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-weight: 600; font-size: 15px; }
    .item-price-small { font-size: 13px; color: var(--accent); font-weight: 500; }
    .btn-view-item { color: var(--accent); background: #f8fafc; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(5px);
      z-index: 2000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content { 
      background: var(--card); width: 100%; max-width: 400px; 
      border-radius: 28px; padding: 30px;
      animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalSlideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .input-field-group { margin-bottom: 15px; }
    .input-field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .input-icon-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon-wrapper i { position: absolute; left: 14px; color: var(--text-muted); font-size: 14px; }
    .input-icon-wrapper input {
      width: 100%; padding: 12px 14px 12px 42px; border: 1px solid var(--border);
      border-radius: 14px; background: #f8fafc; outline: none; font-size: 14px; transition: 0.3s;
    }
    .input-error { border-color: var(--danger) !important; background-color: #fff1f2 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

    .modal-actions-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-modal { 
      padding: 12px; border-radius: 14px; border: none; font-weight: 700; 
      cursor: pointer; font-size: 13px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
    }
    .btn-modal:hover { filter: brightness(0.95); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: #f1f5f9; color: var(--text-main); }
    .btn-danger { background: #fef2f2; color: var(--danger); }
    .btn-accent { background: #eff6ff; color: var(--accent); }
    .btn-success-light { background: #ecfdf5; color: var(--success); }
    .btn-full { width: 100%; flex: none; margin-top: 10px; }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }

    #printSection { 
      display: none; background: #ffffff; color: #1e293b; 
      font-family: 'Inter', system-ui, sans-serif; 
      letter-spacing: 0.3px; word-spacing: 1.5px;
    }
    .print-title { font-size: 14px; font-weight: 600; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }
    .print-table { width: 100%; border-collapse: collapse; }
    .print-table th {
      background: #f1f5f9; color: #0f172a; text-transform: uppercase;
      font-size: 10px; font-weight: 700; padding: 12px;
      border: 1px solid #cbd5e1; text-align: center;
      letter-spacing: 0.5px; word-spacing: 2px;
    }
    .print-table td { 
      padding: 12px 15px; 
      border: 1px solid #cbd5e1; font-size: 12px; 
      vertical-align: middle; 
      line-height: 1.6;
    }
    .print-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }
    .print-no-img { width: 50px; height: 50px; border-radius: 6px; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #94a3b8; background: #f8fafc; }
    .print-footer-notice {
      text-align: center; font-size: 9px; color: #94a3b8; opacity: 0.8;
      border-top: 1px dashed #cbd5e1; padding-top: 12px; font-style: italic;
      word-spacing: 1px;
    }

    @media print {
      @page { size: A4; margin: 20mm 15mm 15mm 15mm; } 
      body { padding: 0 !important; background: #ffffff !important; }
      .header-fixed-top, .footer-total, .container, .modal, #customAlert { display: none !important; }
      #printSection { display: block !important; padding-bottom: 60px; position: relative; }
      .print-footer-notice { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding-bottom: 10px; }
    }

    .export-mode body { padding: 0 !important; background: #ffffff !important; }
    .export-mode .header-fixed-top, .export-mode .footer-total, .export-mode .container, .export-mode .modal, .export-mode #customAlert { display: none !important; }
    .export-mode #printSection { 
      display: block !important; 
      width: 800px; 
      min-height: 1131px; 
      padding: 40px; 
      margin: 0 auto;
      position: relative; 
      box-sizing: border-box;
    }
    .export-mode .print-footer-notice {
      position: absolute;
      bottom: 40px; 
      left: 40px;
      right: 40px;
    }
  </style>
</head>
<body>

  <div id="customAlert">
    <i id="alertIcon" class="fa fa-circle-check"></i> 
    <span id="alertMsg"></span>
  </div>

  <div class="header-fixed-top">
    <div class="search-wrapper">
      <i class="fa fa-search" style="color:var(--text-muted)"></i>
      <input type="text" id="searchInput" placeholder="Ketik nama barang di sini untuk mencari." oninput="handleSearch()">
      <i class="fa fa-circle-xmark" id="resetSearch" onclick="clearSearch()"></i>
    </div>
    <button class="btn-add-main" onclick="openForm()">
      <i class="fa fa-plus"></i>
    </button>
  </div>

  <div class="container" id="itemList"></div>

  <div class="footer-total">
    <div class="footer-left-group">
      <div class="select-all-wrapper" onclick="toggleSelectAll()">
        <input type="checkbox" id="selectAllCheck" class="checkbox-custom" style="width:18px; height:18px;" onclick="event.stopPropagation(); toggleSelectAll();">
        <span>SEMUA</span>
      </div>
      <span class="label">Jumlah</span>
    </div>
    <span class="amount" id="totalPrice">Rp 0</span>
  </div>

  <div id="printSection"></div>

  <div class="modal" id="actionModal">
    <div class="modal-content" style="max-width: 320px; padding: 25px;">
      <div style="font-weight: 800; font-size: 16px; margin-bottom: 20px; text-align: center; color: var(--primary);">Opsi Lanjutan</div>
      
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 10px;">
        <button class="btn-modal btn-outline" style="flex-direction: column; padding: 20px 10px; gap: 10px; background: #f8fafc;" onclick="generatePrintDocument()">
          <i class="fa fa-print" style="color:var(--text-main); font-size: 24px;"></i>
          <span style="font-size: 11px; font-weight: 700;">Cetak Data</span>
        </button>
        <button class="btn-modal btn-outline" style="flex-direction: column; padding: 20px 10px; gap: 10px; background: #f8fafc;" onclick="downloadPDF()">
          <i class="fa fa-file-pdf" style="color:#8b5cf6; font-size: 24px;"></i>
          <span style="font-size: 11px; font-weight: 700;">Unduh PDF</span>
        </button>
        <button class="btn-modal btn-outline" style="flex-direction: column; padding: 20px 10px; gap: 10px; background: #f8fafc;" onclick="downloadPNG()">
          <i class="fa fa-image" style="color:var(--success); font-size: 24px;"></i>
          <span style="font-size: 11px; font-weight: 700;">Unduh PNG</span>
        </button>
        <button class="btn-modal btn-danger" style="flex-direction: column; padding: 20px 10px; gap: 10px; background: #fef2f2; border: 1px solid rgba(239, 68, 68, 0.2);" onclick="confirmDeleteAllFromModal()">
          <i class="fa fa-trash" style="color:var(--danger); font-size: 24px;"></i>
          <span style="font-size: 11px; font-weight: 700; color:var(--danger);">Hapus Semua</span>
        </button>
      </div>

      <button class="btn-modal btn-full" style="background:#f1f5f9; color:var(--text-muted); margin-top: 15px;" onclick="closeModal('actionModal')">Tutup</button>
    </div>
  </div>

  <div class="modal" id="formModal">
    <div class="modal-content">
      <div id="modalTitle" style="font-weight: 800; font-size: 18px; margin-bottom: 25px; text-align: center;">Input Barang</div>
      <input type="hidden" id="editId">
      <input type="hidden" id="inFotoBase64">
      
      <div class="input-field-group">
        <label>Foto Barang</label>
        <div class="input-icon-wrapper">
          <i class="fa fa-image"></i>
          <input type="file" id="inFoto" accept="image/*" onchange="encodeImageFileAsURL(this)" style="padding-top: 9px; padding-bottom: 9px;">
        </div>
      </div>

      <div class="input-field-group">
        <label>Nama Barang</label>
        <div class="input-icon-wrapper">
          <i class="fa fa-shirt"></i>
          <input type="text" id="inNama" placeholder="Contoh: Kaos Polos" oninput="this.classList.remove('input-error')">
        </div>
      </div>
      
      <div class="input-field-group">
        <label>Varian</label>
        <div class="input-icon-wrapper">
          <i class="fa fa-layer-group"></i>
          <input type="text" id="inVarian" placeholder="Contoh: Ukuran XL">
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <div class="input-field-group" style="flex: 1.2;">
          <label>Harga</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-rupiah-sign"></i>
            <input type="text" id="inHarga" placeholder="XX.XXX" oninput="formatInputRupiah(this); this.classList.remove('input-error')">
          </div>
        </div>
        <div class="input-field-group" style="flex: 1;">
          <label>Nama Toko</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-shop"></i>
            <input type="text" id="inToko" placeholder="@tokokaos.id">
          </div>
        </div>
      </div>

      <div class="input-field-group">
        <label>Link Pembelian</label>
        <div class="input-icon-wrapper">
          <i class="fa fa-link"></i>
          <input type="text" id="inLink" placeholder="https://...">
        </div>
      </div>

      <div class="modal-actions-row">
        <button class="btn-modal btn-outline" onclick="closeModal('formModal')">Batal</button>
        <button class="btn-modal btn-primary" onclick="saveData()">Simpan</button>
      </div>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div style="font-weight: 800; font-size: 18px; margin-bottom: 20px; text-align: center;">Informasi Barang</div>
      <div id="detailView"></div>
      <div class="modal-actions-row" id="detailActions"></div>
      <button class="btn-modal btn-outline btn-full" onclick="closeModal('detailModal')">Tutup</button>
    </div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content" style="max-width: 320px; text-align: center;">
      <div id="confirmIcon" style="font-size: 40px; margin-bottom: 15px;"></div>
      <div id="confirmTitle" style="font-weight: 800; font-size: 18px; margin-bottom: 10px;">Konfirmasi</div>
      <p id="confirmMsg" style="color:var(--text-muted); font-size: 14px; margin-bottom: 25px;"></p>
      <div class="modal-actions-row">
        <button class="btn-modal btn-outline" onclick="closeModal('confirmModal')">Tidak</button>
        <button class="btn-modal btn-primary" id="confirmBtn">Ya</button>
      </div>
    </div>
  </div>

  <script>
    let items = [];
    
    localforage.getItem('shoppingListStore').then(function(value) {
      if (value) {
        items = value;
        renderItems();
      }
    }).catch(function(err) {
      console.log("Error memuat data:", err);
    });

    function showAlert(msg, type = 'success') {
      const el = document.getElementById('customAlert');
      const icon = document.getElementById('alertIcon');
      const text = document.getElementById('alertMsg');
      
      text.innerText = msg;
      icon.className = (type === 'error') ? 'fa fa-circle-info' : 'fa fa-circle-check';

      el.style.top = '20px';
      setTimeout(() => { el.style.top = '-100px'; }, 2500);
    }

    function formatInputRupiah(el) {
      let val = el.value.replace(/\D/g, "");
      el.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function encodeImageFileAsURL(element) {
      const file = element.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxSize = 500;
          
          if (width > height && width > maxSize) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else if (height > maxSize) {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          document.getElementById('inFotoBase64').value = canvas.toDataURL('image/jpeg', 0.6);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleSearch() {
      const input = document.getElementById('searchInput');
      document.getElementById('resetSearch').style.display = input.value.length > 0 ? 'block' : 'none';
      renderItems();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      handleSearch();
    }

    function toggleSelectAll() {
      const masterCheck = document.getElementById('selectAllCheck');
      if (event.target.tagName !== 'INPUT') masterCheck.checked = !masterCheck.checked;
      items.forEach(item => item.checked = masterCheck.checked);
      localforage.setItem('shoppingListStore', items).then(function() {
        renderItems();
      });
    }

    function openForm(id = null) {
      document.querySelectorAll('input').forEach(i => i.classList.remove('input-error'));
      if(id) {
        const item = items.find(x => x.id === id);
        document.getElementById('modalTitle').innerText = "Ubah Data";
        document.getElementById('editId').value = item.id;
        document.getElementById('inFotoBase64').value = item.foto || "";
        document.getElementById('inFoto').value = "";
        document.getElementById('inNama').value = item.nama;
        document.getElementById('inVarian').value = item.varian || "";
        document.getElementById('inHarga').value = item.harga.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        document.getElementById('inToko').value = item.toko;
        document.getElementById('inLink').value = item.link || "";
        closeModal('detailModal');
      } else {
        document.getElementById('modalTitle').innerText = "Tambahkan Data Wishlist";
        document.getElementById('editId').value = "";
        ['inNama', 'inVarian', 'inHarga', 'inToko', 'inLink', 'inFoto', 'inFotoBase64'].forEach(id => document.getElementById(id).value = '');
      }
      document.getElementById('formModal').style.display = 'flex';
    }

    function openActionModal() {
      document.getElementById('actionModal').style.display = 'flex';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openConfirm(title, msg, icon, color, action) {
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMsg').innerText = msg;
      const iconEl = document.getElementById('confirmIcon');
      iconEl.innerHTML = icon; iconEl.style.color = color;
      const btn = document.getElementById('confirmBtn');
      btn.style.background = color;
      btn.onclick = () => { action(); closeModal('confirmModal'); };
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function saveData() {
      const editId = document.getElementById('editId').value;
      const inNama = document.getElementById('inNama');
      const inHarga = document.getElementById('inHarga');
      
      const nama = inNama.value.trim();
      const hargaStr = inHarga.value.replace(/\./g, "");

      let errors = [];
      if(!nama) { inNama.classList.add('input-error'); errors.push("Nama Barang"); }
      if(!hargaStr) { inHarga.classList.add('input-error'); errors.push("Harga"); }

      if(errors.length > 0) {
        return showAlert(`${errors.join(' & ')} Belum Diisi`, 'error');
      }

      const data = {
        id: editId ? parseInt(editId) : Date.now(),
        foto: document.getElementById('inFotoBase64').value,
        nama: nama,
        varian: document.getElementById('inVarian').value,
        harga: parseInt(hargaStr),
        toko: document.getElementById('inToko').value || 'Shopee',
        link: document.getElementById('inLink').value,
        checked: editId ? items.find(x => x.id == editId).checked : true
      };

      if(editId) { items = items.map(x => x.id == editId ? data : x); showAlert("Data Berhasil Diperbarui"); }
      else { items.push(data); showAlert("Ditambah"); }
      
      localforage.setItem('shoppingListStore', items).then(function() {
        closeModal('formModal');
        renderItems();
      });
    }

    function confirmDelete(id) {
      openConfirm("Mohon Perhatian !!!", "Data barang ini akan dihapus permanen.", '<i class="fa fa-triangle-exclamation"></i>', 'var(--danger)', () => {
        items = items.filter(i => i.id !== id);
        localforage.setItem('shoppingListStore', items).then(function() {
          closeModal('detailModal');
          renderItems();
          showAlert("Data berhasil dihapus");
        });
      });
    }

    function confirmDeleteAllFromModal() {
      closeModal('actionModal');
      openConfirm("Hapus Semua Barang?", "Seluruh daftar barang Anda akan dihapus permanen.", '<i class="fa fa-triangle-exclamation"></i>', 'var(--danger)', () => {
        items = [];
        localforage.setItem('shoppingListStore', items).then(function() {
          renderItems();
          showAlert("Semua data berhasil dihapus");
        });
      });
    }

    function showDetail(id) {
      const item = items.find(i => i.id === id);
      document.getElementById('detailView').innerHTML = `
        ${item.foto ? `<div style="text-align:center; margin-bottom:15px;"><img src="${item.foto}" style="max-width:100%; max-height:200px; border-radius:12px; object-fit:cover;"></div>` : ''}
        <div style="background:#f8fafc; padding:20px; border-radius:20px; margin-bottom:15px; font-size:14px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="color:var(--text-muted)">Nama</span><b>${item.nama}</b></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="color:var(--text-muted)">Varian</span><b>${item.varian || '-'}</b></div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="color:var(--text-muted)">Toko</span><b>${item.toko}</b></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted)">Harga</span><b style="color:var(--accent)">Rp${item.harga.toLocaleString('id-ID')}</b></div>
        </div>`;
      document.getElementById('detailActions').innerHTML = `
        <button class="btn-modal btn-danger" onclick="confirmDelete(${item.id})"><i class="fa fa-trash"></i> Hapus</button>
        <button class="btn-modal btn-accent" onclick="openForm(${item.id})"><i class="fa fa-edit"></i> Edit</button>
        <button class="btn-modal btn-success-light" onclick="window.open('${item.link || ''}', '_blank')"><i class="fa fa-arrow-up-right-from-square"></i> Lihat</button>`;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function toggleCheck(id) {
      const idx = items.findIndex(i => i.id === id);
      items[idx].checked = !items[idx].checked;
      localforage.setItem('shoppingListStore', items).then(function() {
        renderItems();
      });
    }

    function prepareExportData() {
      const printSection = document.getElementById('printSection');
      const now = new Date();
      const dateString = now.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      let rowsHtml = '';
      let grandTotal = 0;

      items.forEach((item, index) => {
        if (!item.checked) return;
        grandTotal += item.harga;
        const fotoHtml = item.foto 
          ? `<img src="${item.foto}" class="print-img">` 
          : `<div class="print-no-img"><i class="fa fa-image"></i></div>`;

        rowsHtml += `
          <tr>
            <td style="text-align: center; width: 40px;">${index + 1}</td>
            <td style="text-align: center; width: 60px;">${fotoHtml}</td>
            <td>
              <div style="font-weight: 700; color: #0f172a; font-size: 13px; margin-bottom: 4px; word-spacing: 1.5px;">${item.nama}</div>
              <div style="font-size: 11px; color: #64748b; word-spacing: 1.5px;">Varian: ${item.varian || '-'}</div>
            </td>
            <td>
              <div style="font-weight: 600; font-size: 12px; color: #334155; word-spacing: 1.5px;">${item.toko}</div>
              ${item.link ? `<div style="font-size: 10px; color: #6366f1; word-break: break-all; margin-top: 4px;">${item.link}</div>` : ''}
            </td>
            <td style="text-align: right; font-weight: 700; width: 120px;">Rp${item.harga.toLocaleString('id-ID')}</td>
          </tr>
        `;
      });

      printSection.innerHTML = `
        <table style="width: 100%; border-bottom: 2px solid #0f172a; margin-bottom: 25px; border-collapse: collapse;">
          <tr>
            <td style="vertical-align: bottom; border: none; padding: 0; padding-bottom: 10px;">
              <div class="print-title" style="word-spacing: 0px;">Laporan Data Rencana Pembelian Barang</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 5px; word-spacing: 0.5px;">https://jamaludin2025.github.io/LDRPB-by-AJ-Management.html</div>
            </td>
            <td style="vertical-align: bottom; text-align: right; font-size: 11px; color: #64748b; border: none; padding: 0; padding-bottom: 10px;">
              <div style="word-spacing: 0.5px;">Dicetak pada:</div>
              <div style="font-weight: 700; color: #0f172a; margin-top: 5px; word-spacing: 0px;">${dateString}</div>
            </td>
          </tr>
        </table>

        <table class="print-table">
          <thead>
            <tr>
              <th style="text-align: center; width: 40px;">No</th>
              <th style="text-align: center; width: 60px;">Foto</th>
              <th style="text-align: center;">Informasi Barang</th>
              <th style="text-align: center;">Toko / Alamat Pembelian</th>
              <th style="text-align: center; width: 120px;">Harga Barang</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || '<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 20px;">Tidak ada data barang yang dipilih.</td></tr>'}
            <tr style="background: #f8fafc; font-weight: 800;">
              <td colspan="4" style="text-align: right; font-size: 12px; color: #0f172a; padding: 12px; word-spacing: 2px;">TOTAL ESTIMASI ANGGARAN:</td>
              <td style="text-align: right; font-size: 13px; color: #0f172a; padding: 12px;">Rp${grandTotal.toLocaleString('id-ID')}</td>
            </tr>
          </tbody>
        </table>

        <div class="print-footer-notice">
          * Catatan Kaki: Harga yang tertera pada dokumen ini didasarkan pada data per tanggal pencetakan. Nilai nominal harga bersifat fluktuatif dan dapat berubah sewaktu-waktu mengikuti kebijakan dari masing-masing toko penyedia barang.
        </div>
      `;
    }

    function generatePrintDocument() {
      closeModal('actionModal');
      prepareExportData();
      window.print();
    }

    async function downloadPNG() {
      closeModal('actionModal');
      prepareExportData();
      document.body.classList.add('export-mode');
      const el = document.getElementById('printSection');
      
      await new Promise(r => setTimeout(r, 150)); 
      
      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const link = document.createElement('a');
        link.download = 'Shopping-Planner-Export.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showAlert("Berhasil Mengunduh PNG");
      } catch (err) {
        showAlert("Gagal memproses gambar", "error");
      }
      
      document.body.classList.remove('export-mode');
    }

    async function downloadPDF() {
      closeModal('actionModal');
      prepareExportData();
      document.body.classList.add('export-mode');
      const el = document.getElementById('printSection');
      
      await new Promise(r => setTimeout(r, 150));
      
      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save('Shopping-Planner-Export.pdf');
        showAlert("Berhasil Mengunduh PDF");
      } catch (err) {
        showAlert("Gagal memproses PDF", "error");
      }
      
      document.body.classList.remove('export-mode');
    }

    function renderItems() {
      const list = document.getElementById('itemList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      list.innerHTML = '';
      const filtered = items.filter(i => i.nama.toLowerCase().includes(query));

      if(filtered.length === 0) {
        list.innerHTML = `<div class="empty-state"><i class="fa fa-box-open" style="font-size:40px; margin-bottom:15px; opacity:0.2;"></i><br>Belum ada barang yang ditambahkan.</div>`;
      }

      filtered.forEach(item => {
        list.innerHTML += `
          <div class="item-card">
            <div class="item-left">
              <input type="checkbox" class="checkbox-custom" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${item.id})">
              <div class="item-info">
                <span class="item-name">${item.nama}</span>
                <span class="item-price-small">Rp${item.harga.toLocaleString('id-ID')}</span>
              </div>
            </div>
            <button class="btn-view-item" onclick="showDetail(${item.id})"><i class="fa fa-eye"></i></button>
          </div>`;
      });

      const allChecked = items.length > 0 && items.every(i => i.checked);
      const labelEl = document.querySelector('.footer-total .label');
      const totalPriceEl = document.getElementById('totalPrice');
      const total = items.filter(i => i.checked).reduce((sum, i) => sum + i.harga, 0);

      totalPriceEl.innerText = 'Rp' + total.toLocaleString('id-ID').replace(/,/g, '.');

      if (allChecked) {
        labelEl.innerHTML = `
          <div class="footer-actions-group">
            <button onclick="openActionModal()" class="btn-footer-action" title="Opsi Lanjutan">
              <i class="fa fa-ellipsis-vertical"></i>
            </button>
          </div>
        `;
      } else {
        labelEl.innerText = "Jumlah";
      }

      document.getElementById('selectAllCheck').checked = allChecked;
    }

    renderItems();
  </script>
</body>
</html>
